# application.yml —— Spring Boot 的配置中心
# 注意格式：两级缩进 + 冒号后必须有空格，这是 YAML 的规矩
server:
  port: 8080

spring:
  application:
    name: workstation
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/workstation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ""        # 本地开发库为空密码（--initialize-insecure）；上生产必须改，且走环境变量注入

mybatis-plus:
  configuration:
    # 开发期把 SQL 打到控制台——学 ORM 阶段最好的老师就是看它生成的 SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 密钥类配置将来走环境变量注入（.env），不写死在代码里（REQUIREMENTS §5 密钥管理）
