# GitHub Actions 自动部署工作流
# 效果：push 到 main → 自动安装依赖、构建、发布到 GitHub Pages
# 这就是此前聊过的 "CI/CD 工作流" 的真身：一次配置，永久自动
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动触发（Actions 页面有个按钮）

# 部署 Pages 需要的最小权限集（最小权限原则）
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖（npm ci 严格按锁文件装，可复现）
        run: npm ci
        working-directory: frontend

      - name: 构建
        run: npm run build
        working-directory: frontend

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
